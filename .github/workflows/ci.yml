# CI Frip & Co Street — s'active telle quelle une fois le dossier transféré
# dans son propre dépôt. Tant que le code vit dans fripco-street/ du dépôt
# de l'application source, c'est .github/workflows/fripco-street-ci.yml (à la
# racine de ce dépôt-là) qui exécute les mêmes jobs avec un filtre de chemin.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (Python, PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fripco
          POSTGRES_PASSWORD: fripco
          POSTGRES_DB: fripco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Les tests tournent sur PostgreSQL uniquement : les triggers
      # d'inaltérabilité doivent être exercés pour de vrai (audit PR0, I-1).
      TEST_DATABASE_URL: postgresql+asyncpg://fripco:fripco@localhost:5432/fripco_test
      DATABASE_URL: postgresql+asyncpg://fripco:fripco@localhost:5432/fripco_test
      SECRET_KEY: ci-secret-key-not-used-in-prod-00000000
      FISCAL_SIGNING_KEY: ci-fiscal-key-not-used-in-prod-000000
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: python -m pip_audit --skip-editable
      - name: Lint (ruff)
        run: python -m ruff check . --output-format=github
      - name: Migrations Alembic (base vide → head)
        run: |
          python -m alembic upgrade head
          CUR=$(python -m alembic current | awk '{print $1}')
          HEAD=$(python -m alembic heads | awk '{print $1}')
          echo "alembic current=$CUR head=$HEAD"
          test "$CUR" = "$HEAD"
      - name: Tests (PostgreSQL)
        run: python -m pytest tests/ -v --tb=short

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ""

  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.web
          push: false
          build-args: NEXT_PUBLIC_API_URL=
          cache-from: type=gha
          cache-to: type=gha,mode=max

[project]
name = "fripco-street-api"
version = "0.1.0"
description = "Frip & Co Street - API de caisse (Rouen)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "email-validator>=2.0.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    # Épinglé comme sur le monorepo source : ce repo n'a pas de [tool.ruff],
    # et une version récente de ruff (0.16+) applique des règles par défaut
    # bien plus strictes qui signaleraient du code par ailleurs intact.
    "ruff>=0.8.0,<0.9",
    "pip-audit>=2.10.1",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

# Layout plat : `app` est le package importable, `alembic`/`tests`/`scripts`
# vivent à côté. Sans ceci, la découverte auto de setuptools échoue l'install
# éditable avec "Multiple top-level packages discovered in a flat-layout".
[tool.setuptools.packages.find]
include = ["app*"]
